<!DOCTYPE html>

      <path d="M290 220 A110 110 0 0 0 510 220" fill="none" stroke="currentColor" stroke-width="3.2"/>

    <div class="bg-video-overlay"></div>
    <div class="light-orb light-orb-1"></div>

    <section class="hero-v2">

        <div class="avatar-ring"></div>

      <h1 id="hero-nome"></h1>
      <div class="role-lines" id="hero-roles"></div>

      <div class="social-row" id="social-row"></div>

      <div class="panel-header">
        <span class="panel-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.3l3.6 2.6-1.4 4.2h-4.4l-1.4-4.2z" stroke-linejoin="round"/><path d="M12 3.5v3.8M12 14.1v6.4M4.8 8.3l3.1 2.6M16.1 10.9l3.1-2.6M6.2 17.2l3-4.2M17.8 17.2l-3-4.2" stroke-linecap="round"/></svg></span>

          <span class="diario-title" id="grupo2-titulo"></span>
          <p class="diario-slogan" id="grupo2-slogan"></p>
        </div>
      </div>

      <div class="brand-strip" aria-hidden="true">
        <div class="brand-track" id="brand-track"></div>
      </div>

      <ul class="link-list" id="grupo2-lista"></ul>

    <footer class="site-footer">
      <strong id="footer-nome"></strong>
      <span id="footer-ecossistema"></span>
      <span id="footer-dev"></span>

  <script src="data/links.js"></script>
